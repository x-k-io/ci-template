name: Java Service Build and Push Image (JDK 17)

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Docker 镜像名称 (例如: x-k-io/kite-libai)'
        required: false
        type: string
        default: ${{ github.repository }}
      context_path:
        description: 'Docker 构建上下文路径'
        required: false
        type: string
        default: '.'
      sonar_enabled:
        description: '是否开启 SonarCloud 代码质量扫描'
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud 认证 Token'
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Sonar 分析 Git Blame 和提交历史需要完整 commit depth
          fetch-depth: 0

      # 1. 配置 Java 17 与 Gradle 缓存
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 2. 执行多模块 Gradle 编译打包（跳过测试以提升 CI 速度）
      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 3. 可选：SonarCloud 代码质量扫描
      - name: SonarCloud Scan
        if: inputs.sonar_enabled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon

      # 4. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 登录到 GitHub Container Registry (PR 触发时跳过登录)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. 生成镜像标签和元数据
      - name: Derive Image Tags and Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name || github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # 7. 构建并推送 Docker 镜像（复用 GHA 缓存加速）
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_path || '.' }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max