name: Image Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Docker 镜像名称 (例如: x-k-io/kite-libai)'
        required: false
        type: string
        default: ${{ github.repository }}
      context_path:
        description: 'Docker 构建上下文路径'
        required: false
        type: string
        default: '.'
      sonar_enabled:
        description: '是否开启 SonarCloud 代码质量扫描'
        required: false
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud 认证 Token'
        required: false
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Sonar 分析 Git Blame 和提交历史需要完整 commit depth
          fetch-depth: 0

      # ---------------- SonarCloud 代码质量检查 ----------------
      - name: Set up JDK 11
        if: inputs.sonar_enabled
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run SonarCloud Scan
        if: inputs.sonar_enabled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew sonar --no-daemon
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR 无法获取凭据，仅在非 PR 场景（如 Push/Tag）下登录 GHCR
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 在 Step 层面拼接最终使用的镜像名
      - name: Derive Image Tags and Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name || github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_path || '.' }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max